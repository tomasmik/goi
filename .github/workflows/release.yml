name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write

    env:
      IMAGE_NAME: ghcr.io/tomasmik/goi

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate the release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          extension_version="${version%%-*}"
          manifest_version="$(node -p "require('./browser-extension/manifest.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tags must look like v0.2.0 or v0.2.0-rc.1, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ "$extension_version" != "$manifest_version" ]]; then
            echo "Release $version does not match extension $manifest_version" >&2
            exit 1
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGE_NAME:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          if [[ "$version" != *-* ]]; then
            echo "$IMAGE_NAME:latest" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" "${prerelease[@]}"
